# Whole system with ONE command:  docker compose up --build
#   App + UI:        http://localhost:8000
#   Observability:   http://localhost:8000/observability
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pdm
      POSTGRES_PASSWORD: pdm
      POSTGRES_DB: pdm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdm -d pdm"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://pdm:pdm@db:5432/pdm
      ADMIN_TOKEN: dev-admin-token
      SEED_DEMO_DATA: "true"
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  alerter:
    build: .
    working_dir: /app
    command: ["python", "-m", "oncall.alerter"]
    environment:
      HUB_URL: http://app:8000
      ADMIN_TOKEN: dev-admin-token
      RESPONDER_URL: http://responder:9000/alert
      WEBHOOK_SECRET: dev-webhook-secret
      ALERT_INTERVAL_SECONDS: "10"
    depends_on: [app, responder]
    healthcheck: { disable: true }

  responder:
    build: .
    working_dir: /app
    command: ["python", "-m", "oncall.responder"]
    environment:
      HUB_URL: http://app:8000
      ADMIN_TOKEN: dev-admin-token
      WEBHOOK_SECRET: dev-webhook-secret
      RESPONDER_DRY_RUN: "false"
    depends_on: [app]
    healthcheck: { disable: true }

volumes:
  pgdata:
